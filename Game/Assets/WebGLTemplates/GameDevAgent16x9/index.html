<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{{ PRODUCT_NAME }}}</title>
    <link rel="icon" href="data:,"> <!-- no favicon file: avoids a 404 request in the console -->
    <style>
      /* Minimal responsive template: the canvas keeps a 16:9 aspect ratio, is centered and shrinks with the window.
         Unity matches its render size to the canvas DOM size, so the game UI (CanvasScaler) adapts by itself. */
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
      #unity-container { position: fixed; left: 0; top: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: center; }
      #unity-canvas {
        display: block;
        width: min(100vw, calc(100vh * 16 / 9));
        height: min(100vh, calc(100vw * 9 / 16));
        background: #1F1F20;
      }
      #unity-loading { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); color: #ddd; font: 16px Arial, sans-serif; text-align: center; }
      #unity-progress-empty { width: 240px; height: 10px; margin: 8px auto 0; background: #444; border-radius: 5px; overflow: hidden; }
      #unity-progress-full { width: 0%; height: 100%; background: #2fa7e8; }
      #unity-warning { position: absolute; left: 50%; top: 2%; transform: translateX(-50%); display: none; font: 14px Arial, sans-serif; }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" width="{{{ WIDTH }}}" height="{{{ HEIGHT }}}" tabindex="-1"></canvas>
      <div id="unity-loading">
        <div id="unity-loading-text">Loading...</div>
        <div id="unity-progress-empty"><div id="unity-progress-full"></div></div>
      </div>
      <div id="unity-warning"></div>
    </div>
    <script src="Build/{{{ LOADER_FILENAME }}}"></script>
    <script>
      function unityShowBanner(msg, type) {
        var banner = document.querySelector("#unity-warning");
        var div = document.createElement("div");
        div.innerHTML = msg;
        banner.appendChild(div);
        if (type == "error") div.style = "background: red; color: white; padding: 10px;";
        else {
          if (type == "warning") div.style = "background: yellow; padding: 10px;";
          setTimeout(function () {
            banner.removeChild(div);
            banner.style.display = banner.children.length ? "block" : "none";
          }, 5000);
        }
        banner.style.display = banner.children.length ? "block" : "none";
      }

      createUnityInstance(document.querySelector("#unity-canvas"), {
        arguments: [],
#if PROGRESSIVE_ASSET_LOADING
        primaryDataUrls: {{{ JSON.stringify(PRIMARY_DATA_FILES) }}},
        secondaryDataUrls: {{{ JSON.stringify(SECONDARY_DATA_FILES) }}},
#else
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
#endif
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: "Build/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: unityShowBanner,
      }, function (progress) {
        document.querySelector("#unity-progress-full").style.width = (100 * progress) + "%";
      }).then(function (unityInstance) {
        document.querySelector("#unity-loading").style.display = "none";
        window.unityInstance = unityInstance;
      }).catch(function (message) {
        alert(message);
      });
    </script>
  </body>
</html>
